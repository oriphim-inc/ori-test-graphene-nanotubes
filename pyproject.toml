[project]
name = "tbgraphene"
version = "0.1.0"
description = "Tight-binding graphene, Dirac cones, DOS and zone-folded carbon nanotubes"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
